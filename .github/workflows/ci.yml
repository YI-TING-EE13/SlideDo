name: SlideDo CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify build and release readiness
    runs-on: windows-latest
    timeout-minutes: 45

    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
          check-latest: false
          cache: gradle
          cache-dependency-path: |
            android/build.gradle
            android/app/build.gradle
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          cmdline-tools-version: "14742923"
          packages: ""
          accept-android-sdk-licenses: "true"
          log-accepted-android-sdk-licenses: "false"

      - name: Install Android SDK packages
        shell: pwsh
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Run local CI gate
        shell: cmd
        run: ci.bat

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slidedo-ci-artifacts
          if-no-files-found: ignore
          retention-days: 7
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
            dist/desktop/SlideDo-*.zip
            dist/store-assets/android/**/feature-graphic-1024x500.png
            dist/release-manifests/*.txt
