plugins {
    id "com.android.application"
}

android {
    namespace "com.klotski.android"
    compileSdk 36

    defaultConfig {
        applicationId "com.klotski.android"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    sourceSets {
        main.java.srcDirs += ["../../src/com/klotski/core"]
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
